<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="author" content="Luzie Kübler">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rezepte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/introjs.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Header mit Navbar samt Logo -->
    <header>
        <nav class="navbar navbar-expand-lg eigene_navbar fs-5 bg-light mb-4" data-title="Navigation"
            data-intro="Hier kannst du zwischen der Rezeptübersicht, deiner Einkaufsliste und der Erstellung eigener Rezepte wechseln."
            data-step="1" data-tooltip-class="erster-schritt-tooltip">
            <a class="navbar-brand mx-3" href="#"><img src="img/Logo.png" class="img-fluid"
                    alt="Logo der App mit einem Brokkoli, der in einer Pfanne gegart wird"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Navigation ein- oder ausblenden">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Rezepte</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="Einkaufsliste.html">Einkaufsliste</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="EigenesRezept.html">Rezept erstellen</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>


    <main>
        <!-- Suchleiste -->
        <h1 class="visually-hidden">Rezepte suchen und filtern</h1>
        <div class="greenbanner">
            <div class="container">
                <div class="search-container" data-title="Rezeptsuche"
                    data-intro="Gib hier Suchbegriffe oder Zutaten ein, um direkt nach passenden Gerichten zu suchen."
                    data-step="2">
                    <label class="visually-hidden" for="suchbegriff">Rezept oder Zutat suchen</label>
                    <input type="text" class="form-control search-input" placeholder="Rezept oder Zutat suchen..."
                        id="suchbegriff">
                    <button type="button" class="search-btn" aria-label="Suche starten" id="lupenKnopf">
                        <img src="img/Lupensymbol.png" class="search-icon img-fluid"
                            alt="Lupensymbol zur Repräsentation der Suchfunktion">
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter-Dropdowns + Fragezeichen-Knopf -->
        <div style="background-color: var(--hintergrund-hellgruen); padding: 10px;">
            <div class="container">
                <div class="filter-container d-flex align-items-center justify-content-between">

                    <!-- Die Filtergruppe -->
                    <div class="d-flex align-items-center gap-3 flex-wrap" data-title="Rezepte filtern"
                        data-intro="Grenze die Rezepte nach Kategorie, Landesküche oder Schwierigkeitsgrad ein."
                        data-step="3">
                        
                        <!-- Kategorie-Filter -->
                        <div class="filterauswahl d-flex align-items-center gap-2">
                            <label class="form-label mb-0 text-nowrap" for="kategorieFilter">🍽️ Kategorie:</label>
                            <select class="form-control" id="kategorieFilter">
                                <option value="">alle</option>
                                <option value="Frühstück">Frühstück</option>
                                <option value="Vorspeise">Vorspeise</option>
                                <option value="Hauptgericht">Hauptgericht</option>
                                <option value="Dessert">Dessert</option>
                                <option value="Sonstiges">Sonstiges</option>
                            </select>
                        </div>

                        <!-- Küche-Filter -->
                        <div class="filterauswahl d-flex align-items-center gap-2">
                            <label class="form-label mb-0 text-nowrap" for="kuecheFilter">🌍 Landesküche:</label>
                            <select class="form-control" id="kuecheFilter">
                                <option value="">Lädt...</option> <!-- Platzhalter-Wert, der zeigt, dass die Landesküchen noch mittels einer JavaScript-Funktion gesammelt werden -->
                            </select>
                        </div>

                        <!-- Schwierigkeit-Filter -->
                        <div class="filterauswahl d-flex align-items-center gap-2">
                            <label class="form-label mb-0 text-nowrap" for="schwierigkeitFilter">⚙️ Schwierigkeitsgrad:</label>
                            <select class="form-control" id="schwierigkeitFilter">
                                <option value="">alle</option>
                                <option value="leicht">leicht</option>
                                <option value="mittel">mittel</option>
                                <option value="schwer">schwer</option>
                            </select>
                        </div>
                    </div>

                    <!-- Der Fragezeichen-Knopf für das Tutorial -->
                    <button type="button" id="start-tutorial-btn-index"
                        class="btn btn-gruen rounded-circle ms-2 px-3 py-2 fw-bold" title="Hilfe & Tour starten"
                        aria-label="Tutorial starten">
                        ❔
                    </button>
                </div>
            </div>
        </div>


        <!-- Rezeptliste -->
        <div id="statusmeldung" class="visually-hidden" aria-live="polite"></div>
        <div class="container">
            <div id="nulltreffer-meldung" class="alert alert-info text-center my-4 d-none" role="status">
                Keine Rezepte gefunden. Bitte passe die Suche oder die Filter an.
            </div>
        </div>
        <div class="container" data-title="Rezeptübersicht"
            data-intro="Hier werden alle Rezepte angezeigt. Klicke auf ein Rezept, das dich interessiert, um die genauen Details zur Zubereitung zu erfahren!"
            data-step="4">
            <div class="row" id="rezepteListe">
                <div class="col-12 text-center my-5">
                    <p class="text-muted">Rezepte werden geladen...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/7.2.0/intro.min.js"></script>
    <script src="js/script-rezepte.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
